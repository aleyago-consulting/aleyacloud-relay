[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-by-alya-cloud"
version = "0.1.0"
description = "Independent, multi-tenant social publishing service for Alya Cloud."
requires-python = ">=3.12"
dependencies = [
  "Django>=5.1,<5.3",
  "djangorestframework>=3.15,<3.17",
  "psycopg[binary]>=3.2,<3.3",
  "celery[redis]>=5.4,<5.6",
  "PyJWT>=2.10,<3",
  "gunicorn>=23,<24",
  "cryptography>=45,<46",
  "httpx>=0.28,<0.29",
  "boto3>=1.35,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-django>=4.9,<5",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["config*", "relay*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
