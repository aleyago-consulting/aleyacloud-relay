server {
    listen 80;
    server_name relay.aleyacloud.com;

    root /srv/apps/aleya-relay/public;
    index index.html;
    client_max_body_size 12m;

    # The editorial landing remains public and entirely static.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Keep a single, canonical private entry point. This backend must enforce
    # authenticated MFA sessions before an application UI is served here.
    location = /app {
        return 301 /app/;
    }

    location ^~ /app/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    # The API has no static fallback and is never served from the public root.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }
}
