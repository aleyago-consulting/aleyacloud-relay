server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The entry document must always be revalidated. Otherwise a browser can
    # keep pointing at an old hashed JavaScript bundle after a deployment.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Vite names assets by content hash, so those may be cached aggressively.
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
